# One GitHub repo → API + static site + Postgres on Render (free plans).
# Dashboard: New → Blueprint → this repo.

services:
  - type: web
    name: team-1-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    initialDeployHook: npm run seed
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PAYMENTS_MODE
        value: mock_escrow
      - key: OTP_PROVIDER
        value: console
      - key: OTP_EXPOSE_DEV_CODE
        value: "true"
      - key: WEB_ORIGIN
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: team-1-db
          property: connectionString
      - key: PUBLIC_API_URL
        fromService:
          name: team-1-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: team-1-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          name: team-1-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: team-1-db
    plan: free
    databaseName: team1
